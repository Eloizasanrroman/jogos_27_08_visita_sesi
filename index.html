<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jogos</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <div class="forma forma-esquerda"></div>
    <div class="forma forma-direita"></div>

    <div class="linha linha-esquerda"></div>
    <div class="linha linha-direita"></div>

    <div class="circulo circulo-1"></div>
    <div class="circulo circulo-2"></div>

    <div class="pontinhos pontinhos-esquerda">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
    </div>

    <div class="pontinhos pontinhos-direita">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
    </div>


    <main class="pagina">
        <section class="cabecalho">
            <div class="icone-cerebro">
                <i class="fa-solid fa-brain"></i>
            </div>

            <h1>Bem-vindo!</h1>

            <div class="divisor">
                <span></span>
                <i class="fa-solid fa-diamond"></i>
                <span></span>
            </div>

            <h2>Selecione o <strong>jogo</strong> que deseja jogar</h2>
        </section>


        <section class="jogos">
            <div class="card card-memoria">
                <div class="ilustracao memoria-ilustracao">
                    <div class="brilho brilho-1">✦</div>
                    <div class="brilho brilho-2">✦</div>
                    <div class="brilho brilho-3">✦</div>

                    <div class="circulo-fundo"></div>

                    <div class="carta carta-1">
                        <i class="fa-solid fa-star"></i>
                    </div>

                    <div class="carta carta-2">
                        <i class="fa-solid fa-star"></i>
                    </div>
                </div>

                <h3>Jogo da Memória</h3>

                <p>
                    Encontre os pares iguais e<br>
                    treine sua memória!
                </p>

                <button class="botao jogar-memoria">
                    <span>JOGAR</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>


            <div class="card card-palavras">
                <div class="ilustracao palavras-ilustracao">
                    <div class="brilho brilho-a">✦</div>
                    <div class="brilho brilho-b">✦</div>
                    <div class="brilho brilho-c">✦</div>

                    <div class="circulo-fundo"></div>

                    <div class="letra letra-b">B</div>
                    <div class="letra letra-a">A</div>
                    <div class="letra letra-c">C</div>
                </div>

                <h3>Jogo das Palavras</h3>

                <p>
                    Descubra palavras e amplie<br>
                    seu vocabulário!
                </p>

                <button class="botao jogar-palavras">
                    <span>JOGAR</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </section>
    </main>

    <script src="assets/js/script.js"></script>

</body>
</html>
